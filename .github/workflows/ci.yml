name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder Supabase env so the web client constructs and `next build`
  # succeeds without a live backend. Real values are injected at deploy time.
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (web, mobile, packages)
        run: pnpm typecheck

      # PPh 21 / BPJS / proration engine, agent tools and orchestrator: the money path.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright (guard specs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @nexis/web exec playwright install --with-deps chromium

      # No E2E_STORAGE_STATE in CI, so the authenticated describe blocks skip and
      # only the unauthenticated redirect guards run (these need no seeded data).
      - name: Run e2e guard specs
        run: pnpm --filter @nexis/web test:e2e

  database:
    name: Database (migrations, pgTAP, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same CLI version the repo locks (root devDependency), so generated types match.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0

      - name: Apply every migration from zero
        run: supabase db start

      - name: pgTAP (RLS, approval gate, schema cut)
        run: supabase test db

      - name: packages/types matches the schema
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/database.ts"
          if ! diff -u packages/types/src/database.ts "$RUNNER_TEMP/database.ts"; then
            # Compact, machine-applicable form (RCS) for when the artifact is unreachable.
            echo "::group::rcs patch"; diff -n packages/types/src/database.ts "$RUNNER_TEMP/database.ts" || true; echo "::endgroup::"
            exit 1
          fi

      # On drift, publish the freshly generated file so it can be committed as-is.
      - name: Upload regenerated types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: ${{ runner.temp }}/database.ts
